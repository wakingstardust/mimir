name: nas-build

# Builds upstream MakerViking/mimir for CPUs without AVX (TNAS Celeron N5095).
# Stock releases statically link pyke's onnxruntime, compiled -march=x86-64-v3.
# This build switches fastembed to ort-load-dynamic and loads Microsoft's
# onnxruntime from a file at run time (ORT_DYLIB_PATH).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (blank = latest upstream release)"
        required: false
  schedule:
    - cron: "17 14 * * 1"

permissions:
  contents: write

env:
  UPSTREAM: MakerViking/mimir
  ORT_PIN: "=2.0.0-rc.12"
  MS_ORT_VERSION: "1.24.2"
  MS_ORT_SHA256: "43725474ba5663642e17684717946693850e2005efbd724ac72da278fead25e6"
  # Bump when patches/ changes, so the same upstream tag publishes a new release.
  PATCH_REV: "6"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Pick tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag=$(gh api "repos/$UPSTREAM/releases/latest" -q .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=nas-$tag-r$PATCH_REV" >> "$GITHUB_OUTPUT"
          if gh release view "nas-$tag-r$PATCH_REV" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "nas-$tag-r$PATCH_REV already released"
          fi

      - name: Check out this repo's patches
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: fork

      - name: Check out upstream
        if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.tag.outputs.tag }}
          path: src

      - name: Patch fastembed to load onnxruntime dynamically
        if: steps.tag.outputs.skip != 'true'
        working-directory: src
        run: |
          python3 - <<'PY'
          import os, sys
          s = open("Cargo.toml").read()
          ort = 'ort = { version = "%s", default-features = false }\n' % os.environ["ORT_PIN"]
          if ort not in s:
              sys.exit("ort pin changed upstream: choose a matching Microsoft ORT version, then update ORT_PIN and MS_ORT_*")
          old = 'fastembed = "5"\n'
          if s.count(old) != 1:
              sys.exit("fastembed line changed upstream: update the patch")
          s = s.replace(old, 'fastembed = { version = "5", default-features = false, features = ["ort-load-dynamic", "hf-hub-native-tls", "image-models"] }\n')
          open("Cargo.toml", "w").write(s)
          PY
          # Stops the build if upstream moved the code these patches touch.
          for p in ../fork/patches/*.patch; do git apply --check "$p" && git apply "$p"; done
          git diff --stat

      - name: Build
        if: steps.tag.outputs.skip != 'true'
        working-directory: src
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version | tee ../rustc-version.txt
          cargo build --release --locked -p mimir-mem || cargo build --release -p mimir-mem

      - name: Check the binary
        if: steps.tag.outputs.skip != 'true'
        run: |
          bin=src/target/release/mimir
          if strings -n 8 "$bin" | grep -q ort-artifacts; then echo "pyke onnxruntime still linked"; exit 1; fi
          objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          curl -sSfLO "https://github.com/microsoft/onnxruntime/releases/download/v${MS_ORT_VERSION}/onnxruntime-linux-x64-${MS_ORT_VERSION}.tgz"
          echo "${MS_ORT_SHA256}  onnxruntime-linux-x64-${MS_ORT_VERSION}.tgz" | sha256sum -c
          tar xzf "onnxruntime-linux-x64-${MS_ORT_VERSION}.tgz"
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user >/dev/null
          export ORT_DYLIB_PATH="$PWD/onnxruntime-linux-x64-${MS_ORT_VERSION}/lib/libonnxruntime.so.${MS_ORT_VERSION}"
          export MIMIR_HOME="$RUNNER_TEMP/mimir-home"
          (cd src && cargo test -p mimir-mem remember_recall_get_roundtrip)
          # Nehalem = SSE4.2, no AVX: an AVX instruction anywhere on these paths dies with SIGILL.
          q="qemu-x86_64 -cpu Nehalem"
          $q "$bin" --version
          $q "$bin" remember "The TNAS search smoke test stores this sentence about kopia restores" -t note
          $q "$bin" embed --fetch | tee embed.txt
          grep -q "embedded 1 node" embed.txt
          $q "$bin" recall --all --json kopia restore | tee recall.json
          grep -q kopia recall.json
          # The HTTP server must accept an extra Host name from MIMIR_HTTP_ALLOWED_HOSTS and still refuse others.
          MIMIR_HTTP_SNAPSHOT=1 MIMIR_HTTP_SHARED_ENGINE=1 MIMIR_HTTP_ALLOWED_HOSTS=claude-search:7811 $q "$bin" mcp --http 127.0.0.1:7811 > serve.log 2>&1 &
          srv=$!
          for _ in $(seq 1 90); do grep -q "listening on http" serve.log && break; sleep 1; done
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$init" http://127.0.0.1:7811/mcp; }
          ok=$(code claude-search:7811); bad=$(code elsewhere:7811); echo "allowed host -> $ok, other host -> $bad"
          [ "$ok" = 200 ] && [ "$bad" != 200 ]
          # Two sessions on the shared engine must both answer a recall.
          for n in 1 2; do
            sid=$(curl -s -D - -o /dev/null -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d "$init" http://127.0.0.1:7811/mcp | tr -d '\r' | awk -F': ' 'tolower($1)=="mcp-session-id"{print $2}')
            [ -n "$sid" ]
            curl -s -o /dev/null -H "mcp-session-id: $sid" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","method":"notifications/initialized"}' http://127.0.0.1:7811/mcp
            curl -s -H "mcp-session-id: $sid" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"recall","arguments":{"query":"kopia restore","kind":"memory","all_projects":true,"json":true}}}' \
              http://127.0.0.1:7811/mcp | tee "session$n.txt" | grep -q kopia
          done
          kill $srv
          # Snapshot mode: no impression writes, no WAL checkpoint timer.
          grep -q "MIMIR_HTTP_SNAPSHOT=1" serve.log

      - name: Publish
        if: steps.tag.outputs.skip != 'true'
        run: |
          tag=${{ steps.tag.outputs.tag }}
          rel=${{ steps.tag.outputs.release }}
          mkdir out && cp src/target/release/mimir out/mimir
          tar czf "mimir-$tag-linux-x86_64-noavx.tar.gz" -C out mimir
          sha256sum "mimir-$tag-linux-x86_64-noavx.tar.gz" > SHA256SUMS
          cat > notes.md <<NOTES
          Upstream $UPSTREAM $tag, rebuilt for x86-64 CPUs without AVX (fastembed ort-load-dynamic), plus patches/ rev $PATCH_REV (MCP recall can return JSON with paths and search one project by name; MIMIR_HTTP_ALLOWED_HOSTS adds accepted Host names; MIMIR_HTTP_SHARED_ENGINE=1 shares one engine across sessions; MIMIR_HTTP_SNAPSHOT=1 serves a read-only snapshot with no impression writes or WAL checkpoint timer, so the vector cache is never dropped).
          Needs Microsoft onnxruntime ${MS_ORT_VERSION} (sha256 ${MS_ORT_SHA256}) and ORT_DYLIB_PATH pointing at libonnxruntime.so.${MS_ORT_VERSION}.
          Built on ubuntu-22.04 (glibc 2.35) with $(cat rustc-version.txt). Smoke-tested under qemu -cpu Nehalem.
          NOTES
          gh release create "$rel" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mimir $tag for no-AVX x86-64" --notes-file notes.md \
            "mimir-$tag-linux-x86_64-noavx.tar.gz" SHA256SUMS
